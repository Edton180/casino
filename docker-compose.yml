# Instalação local (localhost) com Docker — Windows, macOS ou Linux.
#
#   docker compose up -d          # 1ª vez leva alguns minutos
#   abra http://localhost:8000    # painel: http://localhost:8000/admin
#
# Login padrão do painel: admin@casino.local / admin12345 (altere abaixo ANTES da 1ª execução).
# Parar: docker compose down     Apagar tudo (inclusive o banco): docker compose down -v
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: casino
      MARIADB_USER: casino
      MARIADB_PASSWORD: casino123
      MARIADB_ROOT_PASSWORD: root123
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    environment:
      APP_URL: http://localhost:8000
      SITE_NAME: Meu Cassino
      ADMIN_EMAIL: admin@casino.local
      ADMIN_PASSWORD: admin12345
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: casino
      DB_USERNAME: casino
      DB_PASSWORD: casino123
    volumes:
      - ".:/var/www/html"

volumes:
  db_data:
