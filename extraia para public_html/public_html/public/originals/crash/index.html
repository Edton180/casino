<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Crash</title>
<link rel="stylesheet" href="../_shared/originals.css">
<style>
  canvas { width: 100%; height: 100%; position: absolute; inset: 0; }
  .big { position: relative; z-index: 2; font-size: clamp(48px, 13vw, 110px); font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
  .big.crashed { color: var(--danger); } .big.cashed { color: var(--accent); }
  .sub { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--muted); z-index: 2; font-weight: 700; }
</style>
</head>
<body>
<div class="og-app">
  <aside class="og-side">
    <div class="og-top"><span class="og-title">🚀 Crash</span><span class="og-balance"><small>Saldo</small><span data-balance>—</span></span></div>
    <div>
      <div class="og-label"><span>Valor da aposta</span></div>
      <div class="og-field"><input id="bet" type="number" step="0.01" value="1.00"><button data-bet="half">½</button><button data-bet="double">2×</button></div>
    </div>
    <div>
      <div class="og-label"><span>Auto retirar em (opcional)</span></div>
      <div class="og-field"><input id="auto" type="number" step="0.01" min="1.01" placeholder="ex: 2.00"><button disabled>x</button></div>
    </div>
    <button id="play" class="og-btn">Apostar</button>
    <button id="cashout" class="og-btn danger hidden">Retirar</button>
    <div class="og-fair" id="fair"></div>
    <div class="og-fair">RTP: <span data-rtp>—</span></div>
  </aside>
  <main class="og-stage">
    <canvas id="chart"></canvas>
    <div id="big" class="big">1.00x</div>
    <div id="sub" class="sub">Faça sua aposta</div>
  </main>
</div>
<script src="../_shared/originals.js"></script>
<script>
(function () {
  var GROWTH = 0.00006;
  var canvas = document.getElementById('chart'), ctx = canvas.getContext('2d');
  var big = document.getElementById('big'), sub = document.getElementById('sub');
  var playBtn = document.getElementById('play'), cashBtn = document.getElementById('cashout');
  var getBet = Originals.betInput(document.getElementById('bet'));
  var round = null, clockOffset = 0, raf = null, poll = null, finished = null;

  function resize() { canvas.width = canvas.clientWidth * devicePixelRatio; canvas.height = canvas.clientHeight * devicePixelRatio; }
  window.addEventListener('resize', resize); resize();

  function elapsed() { return Date.now() + clockOffset - round.started_at; }
  function multAt(ms) { return Math.floor(Math.exp(GROWTH * Math.max(0, ms)) * 100) / 100; }

  function drawCurve(ms, color) {
    var w = canvas.width, h = canvas.height, pad = 30 * devicePixelRatio;
    ctx.clearRect(0, 0, w, h);
    var maxT = Math.max(8000, ms * 1.15), maxM = Math.max(2, multAt(ms) * 1.15);
    ctx.strokeStyle = color; ctx.lineWidth = 5 * devicePixelRatio; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var t = 0; t <= ms; t += Math.max(16, ms / 120)) {
      var x = pad + (t / maxT) * (w - pad * 2);
      var y = h - pad - ((Math.exp(GROWTH * t) - 1) / (maxM - 1)) * (h - pad * 2);
      t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function setRunning(running) {
    playBtn.classList.toggle('hidden', running);
    cashBtn.classList.toggle('hidden', !running);
  }

  function frame() {
    if (!round || finished) return;
    var ms = elapsed(), m = multAt(ms);
    big.textContent = m.toFixed(2) + 'x'; big.className = 'big';
    cashBtn.textContent = 'Retirar ' + Originals.money(round.bet * m);
    drawCurve(ms, '#00e701');
    raf = requestAnimationFrame(frame);
  }

  function finish(r) {
    finished = r; round = r;
    cancelAnimationFrame(raf); clearInterval(poll);
    setRunning(false);
    playBtn.disabled = false;
    if (r.status === 'won') {
      big.textContent = Number(r.multiplier).toFixed(2) + 'x'; big.className = 'big cashed';
      sub.textContent = 'Você retirou ' + Originals.money(r.payout) + ' · quebrou em ' + Number(r.crash_point).toFixed(2) + 'x';
    } else {
      big.textContent = Number(r.crash_point).toFixed(2) + 'x'; big.className = 'big crashed';
      sub.textContent = 'Quebrou!';
      drawCurve(Math.log(Math.max(1, r.crash_point)) / GROWTH, '#ed4163');
    }
    Originals.fairness(document.getElementById('fair'), r.fairness);
  }

  function track(r) {
    round = r; finished = null;
    clockOffset = r.server_now - Date.now();
    sub.textContent = r.auto_cashout ? 'Auto retirada em ' + Number(r.auto_cashout).toFixed(2) + 'x' : '';
    setRunning(true);
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    clearInterval(poll);
    poll = setInterval(function () {
      Originals.api('status', { round: round.round }).then(function (d) { if (d.round.status !== 'open') finish(d.round); }).catch(function () {});
    }, 400);
  }

  playBtn.addEventListener('click', function () {
    playBtn.disabled = true;
    var auto = document.getElementById('auto').value;
    Originals.api('start', { bet: getBet(), auto_cashout: auto ? Number(auto) : null })
      .then(function (d) { track(d.round); })
      .catch(function (e) {
        if (e.status === 409 && e.body.round) { track(e.body.round); return; }
        Originals.fail(e); playBtn.disabled = false;
      });
  });

  cashBtn.addEventListener('click', function () {
    if (!round || finished) return;
    cashBtn.disabled = true;
    Originals.api('cashout', { round: round.round })
      .then(function (d) { finish(d.round); })
      .catch(Originals.fail)
      .finally(function () { cashBtn.disabled = false; });
  });

  Originals.init('crash').then(function (info) {
    if (info.round) { info.round.status === 'open' ? track(info.round) : null; }
  }).catch(function () {});
})();
</script>
</body>
</html>
