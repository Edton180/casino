<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dice</title>
<link rel="stylesheet" href="../_shared/originals.css">
<style>
  .board { width: min(100%, 620px); display: flex; flex-direction: column; gap: 28px; }
  .roll { text-align: center; font-size: clamp(48px, 14vw, 96px); font-weight: 900; font-variant-numeric: tabular-nums; }
  .roll.win { color: var(--accent); text-shadow: 0 0 30px rgba(0,231,1,.55); } .roll.lose { color: var(--danger); text-shadow: 0 0 30px rgba(237,65,99,.5); }
  .roll.spin { color: #cfe3ff; filter: blur(.4px); }
  .track { position: relative; height: 18px; border-radius: 999px; background: linear-gradient(180deg, #ff6f8b, var(--danger)); box-shadow: 0 0 18px rgba(237,65,99,.3), inset 0 2px 0 rgba(255,255,255,.2); outline: 8px solid rgba(0,0,0,.25); }
  .track .ok { position: absolute; top: 0; bottom: 0; background: linear-gradient(180deg, #5bff5c, var(--accent)); border-radius: 999px; box-shadow: 0 0 18px rgba(0,231,1,.4); transition: left .15s, right .15s, width .15s; }
  .track input[type=range] { position: absolute; inset: -8px 0; width: 100%; opacity: 0; cursor: pointer; }
  .thumb { position: absolute; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; background: #557086; border-radius: 6px; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .marker { position: absolute; top: -44px; transform: translateX(-50%); background: #fff; color: #0f1923; padding: 5px 10px; border-radius: 8px; font-weight: 900; transition: left .5s cubic-bezier(.2,1.3,.4,1); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .marker::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .marker.win { background: var(--accent); } .marker.win::after { border-top-color: var(--accent); }
  .marker.lose { background: #ff8aa1; } .marker.lose::after { border-top-color: #ff8aa1; }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="og-app">
  <aside class="og-side">
    <div class="og-top"><span class="og-title">🎲 Dice</span><span class="og-balance"><small>Saldo</small><span data-balance>—</span></span></div>
    <div>
      <div class="og-label"><span>Valor da aposta</span></div>
      <div class="og-field"><input id="bet" type="number" step="0.01" value="1.00"><button data-bet="half">½</button><button data-bet="double">2×</button></div>
    </div>
    <div class="og-tabs"><button id="under">Rolar abaixo</button><button id="over" class="active">Rolar acima</button></div>
    <div class="og-row">
      <div class="og-stat"><span>Multiplicador</span><b id="mult">—</b></div>
      <div class="og-stat"><span>Chance de vitória</span><b id="chance">—</b></div>
    </div>
    <div class="og-stat"><span>Lucro se ganhar</span><b id="profit">—</b></div>
    <button id="play" class="og-btn">Rolar</button>
    <div class="og-fair" id="fair"></div>
    <div class="og-fair">RTP: <span data-rtp>—</span></div>
  </aside>
  <main class="og-stage">
    <div class="board">
      <div id="roll" class="roll">50.00</div>
      <div>
        <div class="track" id="track">
          <div class="ok" id="ok"></div>
          <div class="thumb" id="thumb"></div>
          <div class="marker hidden" id="marker">0</div>
          <input id="target" type="range" min="2" max="98" step="0.01" value="50">
        </div>
        <div class="scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
      </div>
      <div style="text-align:center;color:var(--muted)">Alvo: <b id="targetLabel" style="color:#fff">50.00</b></div>
    </div>
  </main>
</div>
<script src="../_shared/originals.js"></script>
<script>
(function () {
  var over = true, busy = false, rtp = 97;
  var target = document.getElementById('target');
  var getBet = Originals.betInput(document.getElementById('bet'));

  function chance() { var t = Number(target.value); return over ? 100 - t : t; }
  function mult() { return Math.floor((rtp / chance()) * 10000) / 10000; }

  function update() {
    var t = Number(target.value);
    document.getElementById('targetLabel').textContent = t.toFixed(2);
    document.getElementById('thumb').style.left = t + '%';
    var ok = document.getElementById('ok');
    if (over) { ok.style.left = t + '%'; ok.style.right = '0'; } else { ok.style.left = '0'; ok.style.right = (100 - t) + '%'; }
    document.getElementById('chance').textContent = chance().toFixed(2) + '%';
    document.getElementById('mult').textContent = mult().toFixed(4) + 'x';
    document.getElementById('profit').textContent = Originals.money(getBet() * mult() - getBet());
  }

  function side(isOver) {
    over = isOver;
    document.getElementById('over').classList.toggle('active', over);
    document.getElementById('under').classList.toggle('active', !over);
    update();
  }

  document.getElementById('over').onclick = function () { side(true); };
  document.getElementById('under').onclick = function () { side(false); };
  target.addEventListener('input', update);
  document.getElementById('bet').addEventListener('input', update);

  document.getElementById('play').addEventListener('click', function () {
    if (busy) return;
    busy = true; this.disabled = true;
    var btn = this;
    Originals.api('play', { bet: getBet(), target: Number(target.value), over: over })
      .then(function (data) {
        var r = data.result, rollEl = document.getElementById('roll'), marker = document.getElementById('marker');
        marker.classList.remove('hidden');
        marker.className = 'marker';
        marker.style.left = r.roll + '%';
        // número "rolando" até o resultado
        var start = performance.now(), dur = 450;
        rollEl.className = 'roll spin';
        (function tick(now) {
          var k = Math.min(1, (now - start) / dur);
          var v = k < 1 ? Math.random() * 100 : Number(r.roll);
          rollEl.textContent = v.toFixed(2); marker.textContent = v.toFixed(2);
          if (k < 1) return requestAnimationFrame(tick);
          rollEl.className = 'roll ' + (data.won ? 'win' : 'lose');
          marker.className = 'marker ' + (data.won ? 'win' : 'lose');
          Originals.result({ won: data.won, payout: data.payout, multiplier: data.won ? r.multiplier : 0, quiet: Number(r.multiplier) < 3 });
        })(start);
        Originals.sound('click');
        Originals.fairness(document.getElementById('fair'), data.fairness);
      })
      .catch(Originals.fail)
      .finally(function () { busy = false; btn.disabled = false; });
  });

  Originals.init('dice').then(function (info) { rtp = info.rtp; update(); }).catch(function () {});
  update();
})();
</script>
</body>
</html>
