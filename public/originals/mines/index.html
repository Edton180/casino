<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mines</title>
<link rel="stylesheet" href="../_shared/originals.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(100%, 460px); aspect-ratio: 1; }
  .cell { border: 0; border-radius: 12px; background: linear-gradient(180deg, #3d5a6e, #2f4553); cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #1a2c38, inset 0 1px 0 rgba(255,255,255,.12); transition: transform .12s, background .2s, box-shadow .2s;
    display: flex; align-items: center; justify-content: center; padding: 14%; }
  .cell:hover:not(:disabled) { transform: translateY(-4px); background: linear-gradient(180deg, #557086, #3d5a6e); box-shadow: 0 10px 0 #1a2c38, 0 0 18px rgba(20,117,225,.35); }
  .cell:disabled { cursor: default; }
  .cell.gem { background: radial-gradient(circle at 50% 40%, #0f5a43, #0a2f26); box-shadow: 0 6px 0 #062a20, 0 0 22px rgba(0,231,1,.35); }
  .cell.mine { background: radial-gradient(circle at 50% 40%, #7a1730, #3a0c18); box-shadow: 0 6px 0 #2d0a14, 0 0 26px rgba(237,65,99,.5); }
  .cell.ghost { opacity: .4; box-shadow: 0 6px 0 #1a2c38; }
  .cell svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  .cell .ic { animation: pop .3s cubic-bezier(.2,1.6,.4,1); display: block; width: 100%; height: 100%; }
  .cell.mine .ic { animation: boom .45s ease-out; }
  @keyframes pop { from { transform: scale(.2) rotate(-20deg); } to { transform: none; } }
  @keyframes boom { 0% { transform: scale(.2); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div class="og-app">
  <aside class="og-side">
    <div class="og-top"><span class="og-title">💎 Mines</span><span class="og-balance"><small>Saldo</small><span data-balance>—</span></span></div>

    <div>
      <div class="og-label"><span>Valor da aposta</span></div>
      <div class="og-field">
        <input id="bet" type="number" step="0.01" min="0" value="1.00">
        <button data-bet="half">½</button><button data-bet="double">2×</button>
      </div>
    </div>

    <div>
      <div class="og-label"><span>Minas</span><span>Casas: 25</span></div>
      <div class="og-field"><select id="mines"></select></div>
    </div>

    <div class="og-row">
      <div class="og-stat"><span>Multiplicador</span><b id="mult">0,00x</b></div>
      <div class="og-stat"><span>Próxima casa</span><b id="next">—</b></div>
    </div>

    <button id="play" class="og-btn">Apostar</button>
    <button id="cashout" class="og-btn danger hidden">Retirar</button>
    <div class="og-fair" id="fair"></div>
    <div class="og-fair">RTP: <span data-rtp>—</span></div>
  </aside>

  <main class="og-stage">
    <div id="result" class="og-result hidden"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script src="../_shared/originals.js"></script>
<script>
(function () {
  var grid = document.getElementById('grid');
  var playBtn = document.getElementById('play');
  var cashBtn = document.getElementById('cashout');
  var minesSel = document.getElementById('mines');
  var resultEl = document.getElementById('result');
  var getBet = Originals.betInput(document.getElementById('bet'));
  var round = null;
  var busy = false;

  for (var m = 1; m <= 24; m++) {
    var o = document.createElement('option');
    o.value = m; o.textContent = m + (m === 1 ? ' mina' : ' minas');
    if (m === 3) o.selected = true;
    minesSel.appendChild(o);
  }

  var cells = [];
  for (var i = 0; i < 25; i++) {
    var b = document.createElement('button');
    b.className = 'cell'; b.disabled = true; b.dataset.index = i;
    b.addEventListener('click', onCell);
    grid.appendChild(b); cells.push(b);
  }

  var GEM = '<svg viewBox="0 0 64 64"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8dffc9"/><stop offset="1" stop-color="#00c776"/></linearGradient></defs>' +
    '<polygon points="32,6 56,22 32,58 8,22" fill="url(#g1)"/><polygon points="32,6 56,22 32,26" fill="#c8ffe6"/><polygon points="8,22 32,26 32,58" fill="#00a862"/>' +
    '<polygon points="32,26 56,22 32,58" fill="#04d384"/><polygon points="20,14 32,6 44,14 32,26" fill="#e9fff4" opacity=".55"/></svg>';
  var BOMB = '<svg viewBox="0 0 64 64"><circle cx="30" cy="36" r="20" fill="#1b1b24"/><circle cx="24" cy="30" r="6" fill="#4b4b5c"/>' +
    '<rect x="38" y="12" width="8" height="12" rx="2" transform="rotate(35 42 18)" fill="#59596b"/><path d="M46 12 q6 -8 12 -2" stroke="#d9a35b" stroke-width="3" fill="none"/>' +
    '<circle cx="58" cy="9" r="4" fill="#ffc83d"/><circle cx="58" cy="9" r="2" fill="#fff"/></svg>';

  function fmtMult(v) { return Number(v || 0).toFixed(2).replace('.', ',') + 'x'; }

  function render(r) {
    round = r;
    var open = r && r.status === 'open';
    cells.forEach(function (c, idx) {
      c.className = 'cell'; c.innerHTML = '';
      c.disabled = !open || (r && r.revealed.indexOf(idx) !== -1);
      if (!r) return;
      if (r.revealed.indexOf(idx) !== -1) { c.classList.add('gem'); c.innerHTML = '<span class="ic">' + GEM + '</span>'; }
      if (r.layout) {
        if (r.layout.indexOf(idx) !== -1) { c.classList.add('mine'); c.innerHTML = '<span class="ic">' + BOMB + '</span>'; if (r.hit !== idx) c.classList.add('ghost'); }
        else if (r.revealed.indexOf(idx) === -1) { c.classList.add('gem', 'ghost'); c.innerHTML = GEM; }
      }
    });
    document.getElementById('mult').textContent = fmtMult(r ? r.multiplier : 0);
    document.getElementById('next').textContent = r && r.next_multiplier && open ? fmtMult(r.next_multiplier) : '—';
    playBtn.classList.toggle('hidden', !!open);
    cashBtn.classList.toggle('hidden', !open);
    cashBtn.disabled = !open || !r.revealed.length;
    cashBtn.textContent = open && r.revealed.length ? 'Retirar ' + Originals.money(r.bet * r.multiplier) : 'Retirar';
    minesSel.disabled = !!open;
    Originals.fairness(document.getElementById('fair'), r && r.fairness);

    resultEl.classList.add('hidden');
    if (r && r.status === 'lost') { resultEl.className = 'og-result lose'; resultEl.textContent = 'Você encontrou uma mina!'; }
  }

  // efeitos só quando a rodada termina por uma jogada (não ao reabrir o jogo)
  function finish(r) {
    if (!r || r.status === 'open') { Originals.sound('tick'); return; }
    if (r.status === 'lost') Originals.shake(grid);
    Originals.result({ won: r.status === 'won', payout: r.payout, multiplier: r.status === 'won' ? r.multiplier : 0 });
  }

  function onCell(e) {
    if (busy || !round || round.status !== 'open') return;
    busy = true;
    var idx = Number(e.currentTarget.dataset.index);
    Originals.api('reveal', { round: round.round, cell: idx })
      .then(function (data) { render(data.round); finish(data.round); })
      .catch(Originals.fail)
      .finally(function () { busy = false; });
  }

  playBtn.addEventListener('click', function () {
    if (busy) return;
    busy = true; playBtn.disabled = true;
    Originals.sound('click');
    Originals.api('start', { bet: getBet(), mines: Number(minesSel.value) })
      .then(function (data) { render(data.round); })
      .catch(function (err) { if (err.status === 409 && err.body.round) render(err.body.round); else Originals.fail(err); })
      .finally(function () { busy = false; playBtn.disabled = false; });
  });

  cashBtn.addEventListener('click', function () {
    if (busy || !round) return;
    busy = true; cashBtn.disabled = true;
    Originals.api('cashout', { round: round.round })
      .then(function (data) { render(data.round); finish(data.round); })
      .catch(Originals.fail)
      .finally(function () { busy = false; });
  });

  Originals.init('mines').then(function (info) { render(info.round || null); }).catch(function () {});
})();
</script>
</body>
</html>
